version: '3.9'

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: mjmovies_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - backend_streams:/var/www/streams:ro
      - backend_posters:/var/www/posters:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - mjmovies_net
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      target: production
    container_name: mjmovies_backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: "mysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_NAME}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      FRONTEND_URL: ${FRONTEND_URL}
      UPLOADS_DIR: /app/uploads
      STREAMS_DIR: /app/streams
      POSTERS_DIR: /app/posters
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      COOKIE_SECRET: ${COOKIE_SECRET}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-5000}
    volumes:
      - backend_uploads:/app/uploads
      - backend_streams:/app/streams
      - backend_posters:/app/posters
      - backend_logs:/app/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - mjmovies_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mjmovies_frontend
    networks:
      - mjmovies_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: mjmovies_redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - mjmovies_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  migrate:
    build:
      context: ./backend
      target: production
    container_name: mjmovies_migrate
    command: sh -c "npx prisma migrate deploy && node prisma/seed.js"
    environment:
      DATABASE_URL: "mysql://${DB_USER}:${DB_PASSWORD}@mysql:3306/${DB_NAME}"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mjmovies_net
    restart: "no"

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  backend_uploads:
    driver: local
  backend_streams:
    driver: local
  backend_posters:
    driver: local
  backend_logs:
    driver: local

networks:
  mjmovies_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24
