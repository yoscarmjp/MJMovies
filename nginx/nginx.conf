worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ====================================
    # SEGURIDAD — Headers globales
    # ====================================
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off; # No exponer versión de Nginx

    # ====================================
    # PERFORMANCE
    # ====================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 5G; # Para subida de archivos grandes

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json
        application/xml application/rss+xml
        application/vnd.apple.mpegurl;
    gzip_disable "msie6";

    # ====================================
    # RATE LIMITING — A nivel Nginx
    # ====================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/h;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ====================================
    # UPSTREAM SERVERS
    # ====================================
    upstream backend {
        server backend:5000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 16;
    }

    # ====================================
    # LOGGING sin datos sensibles
    # ====================================
    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ====================================
    # SERVIDOR PRINCIPAL
    # ====================================
    server {
        listen 80;
        server_name _;

        # Limit de conexiones por IP
        limit_conn conn_limit 20;

        # ====================================
        # ARCHIVOS ESTÁTICOS HLS — Alta performance
        # Servidos directamente por Nginx, sin pasar por Node.js
        # ====================================
        location /streams/ {
            alias /var/www/streams/;
            limit_req zone=api_limit burst=200 nodelay;

            # CORS para HLS
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, OPTIONS";
            add_header Access-Control-Max-Age "86400";

            # Cache agresivo para segmentos .ts (no cambian)
            location ~* \.ts$ {
                expires 1h;
                add_header Cache-Control "public, max-age=3600, immutable";
            }

            # No cachear playlists .m3u8 (actualizadas frecuentemente)
            location ~* \.m3u8$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store";
                add_header Content-Type "application/vnd.apple.mpegurl";
            }

            try_files $uri =404;
        }

        # Posters
        location /posters/ {
            alias /var/www/posters/;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Content-Type-Options "nosniff";
            try_files $uri =404;
        }

        # ====================================
        # API ENDPOINTS
        # ====================================
        location /api/auth/ {
            limit_req zone=login_limit burst=3 nodelay;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params;
        }

        location /api/admin/movies {
            limit_req zone=upload_limit burst=2 nodelay;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params;
            client_max_body_size 5G;
            proxy_read_timeout 3600s; # 1h para uploads grandes
            proxy_send_timeout 3600s;
        }

        location /api/ {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://backend;
            include /etc/nginx/proxy_params;
        }

        # ====================================
        # WEBSOCKET — Socket.io
        # ====================================
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 86400s;
        }

        # ====================================
        # FRONTEND — Vue SPA
        # ====================================
        location / {
            proxy_pass http://frontend;
            include /etc/nginx/proxy_params;

            # Necesario para Vue Router history mode
            try_files $uri $uri/ @fallback;
        }

        location @fallback {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }

        # Bloquear acceso a archivos ocultos
        location ~ /\. {
            deny all;
            return 404;
        }
    }

    # ====================================
    # SERVIDOR HTTPS (activar en producción)
    # Descomenta y configura tu dominio + certificados
    # ====================================
    # server {
    #     listen 443 ssl http2;
    #     server_name tudominio.com;
    #
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #
    #     # ... (mismo contenido que arriba)
    # }
    #
    # Redirigir HTTP a HTTPS
    # server {
    #     listen 80;
    #     server_name tudominio.com;
    #     return 301 https://$host$request_uri;
    # }
}
